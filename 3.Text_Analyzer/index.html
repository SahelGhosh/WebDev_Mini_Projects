<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Analyzer</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <form action="">
        <div class="container">
            <h1>Text Analyzer</h1>
            <textarea name="textarea" id="textarea" placeholder="Type something here" rows="5" cols="50" maxlength="100"></textarea>

            <div class="analyze">
                <div class="characters">Characters : </div>
                <div class="words">Words : </div>
                <p>Character Limit is 100 </p>
            </div>
            <button type="reset" class="clear">Clear</button>
            <script src="app.js"></script>
        </div>
    </form>
</body>

</html>
